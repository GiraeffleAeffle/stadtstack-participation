host: mitmachen.stadtstack.eu
image:
  repository: ghcr.io/giraeffleaeffle/stadtstack-participation
  digest: ""
policy: {}
config:
  DISPLAY_NAME: Strausberg
  # Shown on every page; an independent operator is never presented as the municipality.
  OPERATOR_NAME: Stadtstack
  OPERATOR_IS_MUNICIPALITY: "false"
  CHAIN_ID: ""
  REGISTRY_ADDRESS: ""
  PUBLIC_RPC_URL: ""
  CLIENT_KEY_HEADER: x-real-ip
  EUDI_INTENDED_USE_ID: TEST-01
storage:
  className: hcloud-volumes
  size: 2Gi
web:
  # Measured: proof verification peaks at about 170 MiB RSS and 64 ms per ballot.
  # The shared cluster had under 700 Mi of requestable memory per node (9 Oct 2026).
  resources:
    requests: {cpu: "100m", memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
backup:
  resources:
    requests: {cpu: "20m", memory: 64Mi}
    limits: {cpu: "500m", memory: 256Mi}
ingress:
  clusterIssuer: letsencrypt-prod
  haproxySources:
    - 10.42.0.10/32
    - 10.42.0.11/32
    - 10.42.0.12/32
    - 10.244.0.0/32
    - 10.244.1.0/32
    - 10.244.2.0/32
    - 10.244.0.1/32
    - 10.244.1.1/32
    - 10.244.2.1/32
egress:
  # Standard Kubernetes policies cannot select hostnames. Pin reviewed public
  # A/AAAA addresses (/32 or /128), update deliberately when DNS changes.
  rpcCidrs: []
  eudiCidrs: []
