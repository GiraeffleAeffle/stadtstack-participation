apiVersion: batch/v1
kind: CronJob
metadata:
  name: stadtstack-participation-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "participation.helmLabels" . | nindent 4 }}
    app.kubernetes.io/name: stadtstack-participation
    app.kubernetes.io/component: backup
spec:
  schedule: "0 */6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stadtstack-participation
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          # ReadWriteOnce permits two Pods on one node, not attachment to two nodes.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: stadtstack-participation
                      app.kubernetes.io/component: web
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: {{ include "participation.image" . | quote }}
              imagePullPolicy: IfNotPresent
              command: ["node", "/backup-script/backup.mjs"]
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                # SQLite may update shared-memory bookkeeping while reading a live WAL database.
                - name: data
                  mountPath: /data
                - name: backups
                  mountPath: /backups
                - name: backup-script
                  mountPath: /backup-script
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: participation-data
            - name: backups
              persistentVolumeClaim:
                claimName: participation-backups
            - name: backup-script
              configMap:
                name: participation-backup-script
                defaultMode: 0444
