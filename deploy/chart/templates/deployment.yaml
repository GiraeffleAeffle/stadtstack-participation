apiVersion: apps/v1
kind: Deployment
metadata:
  name: stadtstack-participation
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: stadtstack-participation, app.kubernetes.io/component: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: stadtstack-participation, app.kubernetes.io/component: web}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: {{ include "participation.image" . | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          envFrom: [{configMapRef: {name: participation-config}}]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: policy, mountPath: /run/policy, readOnly: true}
            - {name: secrets, mountPath: /run/secrets/participation, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: participation-data}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: policy
          configMap: {name: participation-policy, defaultMode: 0444}
        - name: secrets
          secret:
            secretName: participation-secrets
            defaultMode: 0440
            items:
              - {key: issuer-signing-key.pem, path: issuer-signing-key.pem}
              {{- if eq (include "participation.adapterKind" .) "eudi_pid_v1" }}
              - {key: eudi-uniqueness-key, path: eudi-uniqueness-key}
              {{- end }}
