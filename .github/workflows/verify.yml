name: Verify
on:
  push:
  pull_request:
permissions: {}
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.4.4
      - name: Install pinned Noir and Barretenberg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.nargo/bin" "$HOME/.bb"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/noir-lang/noirup/bedac8fbe6a059177c35e565f9f76db54a795976/noirup -o "$RUNNER_TEMP/noirup"
          bash "$RUNNER_TEMP/noirup" --version 1.0.0-beta.18
          # bbup derives an asset name this release does not publish and hides the
          # failed download, so fetch the exact asset and check its digest.
          curl --fail --silent --show-error --location https://github.com/AztecProtocol/aztec-packages/releases/download/v3.0.0-nightly.20251104/barretenberg-amd64-linux.tar.gz -o "$RUNNER_TEMP/bb.tar.gz"
          echo "c6dae1092fed8d1230c2345ffcf4c903a2d787d0e220e9ea8c94b0511ed29c9b  $RUNNER_TEMP/bb.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/bb.tar.gz" -C "$HOME/.bb"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bb" >> "$GITHUB_PATH"
      - name: Verify installed versions
        run: |
          nargo --version
          bb --version
          forge --version
      - run: npm ci
      - run: npm run verify
