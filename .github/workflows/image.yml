name: Image
# Publication is an owner decision: push an image-* tag only after Verify passes.
on:
  push:
    tags: ['image-*']
permissions: {}
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/giraeffleaeffle/stadtstack-participation
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/GiraeffleAeffle/stadtstack-participation
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report immutable release digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Stadtstack Participation image'
            echo "Image: \`${IMAGE}@${DIGEST}\`"
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo 'Pin this digest in deploy/values/mitmachen.stadtstack.eu.yaml.'
            echo 'First publication: owner must make the GHCR package public so the cluster can pull without a registry credential.'
          } >> "$GITHUB_STEP_SUMMARY"
