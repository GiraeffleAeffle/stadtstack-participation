[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
allow_paths = ["../node_modules/@openzeppelin/contracts"]
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
