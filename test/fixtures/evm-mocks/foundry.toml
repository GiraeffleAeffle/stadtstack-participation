# Build: forge build --root test/fixtures/evm-mocks
# Regenerate bytecode.json: node test/fixtures/evm-mocks/build-bytecode.mjs
[profile.default]
src = "src"
out = "out"
cache_path = "cache"
solc = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
